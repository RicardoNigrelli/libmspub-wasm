name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the WebAssembly module (Docker, pinned emsdk)
        run: ./build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Apache POI test files (Apache-2.0, public): versions 98-2010, a brochure, a newsletter
      # and three fuzzer-minimized broken files that must be rejected cleanly.
      - name: Download the Apache POI .pub test files
        run: |
          mkdir -p corpus
          gh api repos/apache/poi/contents/test-data/publisher --jq '.[] | select(.name|endswith(".pub")) | .download_url' \
            | xargs -n1 -P4 curl -fsSL --retry 3 -O --output-dir corpus
          ls corpus | wc -l
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Parse every file (Oz)
        run: node test/run-corpus.mjs corpus --variant Oz

      # No POI file has a cropped picture: this writes the MS-ODRAW crop properties into a copy of
      # 51318.pub and checks that they reach the JSON (patch 0003).
      - name: Picture crop (patch 0003)
        run: node test/crop-fopt.mjs corpus --variant Oz

      - name: Mutation smoke test (crashes / hangs)
        run: node test/fuzz-smoke.mjs corpus --n 500 --seed 1

      - name: sha256 of the artifacts
        run: sha256sum dist/*/* | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: libmspub-wasm
          path: dist/
          retention-days: 30
